services:
  db:
    image: postgres:16-alpine
    container_name: pharmacy_db
    environment:
      POSTGRES_DB: pharmacy
      POSTGRES_USER: pharmacy
      POSTGRES_PASSWORD: pharmacy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmacy"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
