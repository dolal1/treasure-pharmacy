# Render blueprint for the Django API. The database lives on Neon (free tier)
# and the frontend on Vercel — paste those values into the sync:false vars.
services:
  - type: web
    name: pharmacy-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/services/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # Neon connection string (postgres://...?sslmode=require)
      - key: ALLOWED_HOSTS
        sync: false # e.g. pharmacy-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false # e.g. https://treasure-pharmacy.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        sync: false # e.g. https://pharmacy-api.onrender.com
      - key: ADMIN_URL
        sync: false # unguessable path, e.g. office-7f3k9q/
      - key: PHARMACY_INBOX_EMAIL
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false # Resend API key
