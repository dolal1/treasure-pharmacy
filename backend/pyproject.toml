[project]
name = "pharmacy-backend"
version = "0.1.0"
description = "Treasure Pharmacy — Django REST API backend"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.16",
    "drf-spectacular>=0.28",
    "django-cors-headers>=4.7",
    "django-environ>=0.12",
    "django-unfold>=0.44",
    "django-storages[s3]>=1.14",
    "psycopg[binary]>=3.2",
    "pillow>=11.0",
    "weasyprint>=63.0",
    "whitenoise>=6.8",
    "gunicorn>=23.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "DJ", "B", "UP"]
